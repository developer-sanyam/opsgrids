# The production edge — one Linux VM, ADR-0012 §1.
#
# Every product this platform sells can run here, one compose profile per product (ADR-0013
# §5). That is 45 containers with every profile on (down from 46: ADR-0013's memory-budget
# erratum, 2026-09-23, folded subscription's and approval's `bin/cron` sweep into their
# `bin/worker` the way `notification/app/worker.py` already combines two consumers), plus
# Postgres, Redis, RabbitMQ and Caddy. This is not "five service containers" and not "~35
# processes" — that described slice 1, one profile in, and stayed in comments long after it
# stopped being true. `memory-budget.json` in this directory is the source of truth for what
# each container actually costs; `preflight.sh` sums it against the box's live MemTotal and
# refuses a deploy whose enabled `COMPOSE_PROFILES` do not fit (see the erratum for why the box
# does not grow to meet them instead — the owner will not resize it).
#
# Read `RUNBOOK.md` before touching this file on a box that is serving. Once one real domain
# points at this address there is a production and there is no second box.
#
# Parity rules that are not style preferences:
#   * The Postgres and Redis images are the ones `tools/dev-bootstrap/compose.yml` uses.
#     PostGIS, SKIP LOCKED and ON CONFLICT are load-bearing in the domain; a different engine
#     version here is a bug you find in production.
#   * Nothing but Caddy publishes a port. Postgres and Redis are reachable on the compose
#     network and nowhere else — a published 5432 on a public IP is the shortest path from
#     "we have a production" to "we had a production".
#   * Every value that differs between boxes is an ${ENV_VAR} read from `.env`, which lives on
#     the box and is never committed. See `.env.example` for the full list; `preflight.sh`
#     refuses to deploy when one is missing or still a placeholder.
#
# Commands are in the Makefile (`make deploy`, `make edge-*`). Do not run `docker compose up`
# by hand on the box without reading the runbook's "a failed build must not take the site
# down" section — the deploy builds first and swaps second on purpose.

name: opsgrids-edge

# Docker's json-file driver grows without limit, and this box has 80 GB and no log shipping
# (slice 2). An unrotated container log is the most likely reason this VM runs out of disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# What every Python service needs to be itself in production. Per-service additions sit in the
# service's own `environment:` block below.
#
# DATABASE_URL carries the *shared* application password and a username that each service
# immediately rewrites to its own role (`ServiceSettings.dsn_as`, and every service pins its
# own `db_app_role`). That is the same arrangement development uses. The alternative — a DSN
# per service with a password per role — is a deployment system, and this is one VM.
x-service-env: &service-env
  ENVIRONMENT: production
  DEBUG: 'false'
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: 'true'
  DATABASE_URL: postgresql+asyncpg://opsgrids_app:${OPSGRIDS_DB_PASSWORD}@postgres:5432/opsgrids
  REDIS_URL: redis://redis:6379/0
  # The broker (ADR-0013 §5). Every service's relay publishes its outbox here and every
  # consumer reads from it; this is what makes activation install roles without a human.
  RABBITMQ_URL: amqp://opsgrids:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  # ~38 processes (`memory-budget.json`'s api + background containers) share one Postgres with
  # every product profile on, and an API holds up to three engines (app, outbox, directory).
  # Pools fill lazily, so idle is a fraction of this, but the ceiling is what a spike reaches:
  # 3 + 2 keeps it near the 400 Postgres allows, where the library default (10 + 5) would want
  # well over a thousand.
  # glibc gives every thread its own malloc arena; across ~38 mostly idle Python processes
  # that is resident memory this box swaps for. Two arenas cost nothing measurable here.
  MALLOC_ARENA_MAX: '2'
  # glibc's trim threshold ratchets up to 128 MB, so a long-lived idle process never gives back
  # what it grew importing and serving its first burst. Pinned, free() returns it to the kernel.
  MALLOC_TRIM_THRESHOLD_: '131072'
  DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
  JWKS_URL: http://auth:8000/.well-known/jwks.json
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_KID: ${JWT_KID}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
  PII_DECRYPT_KEYS: ${PII_DECRYPT_KEYS:-}
  APP_BASE_URL: ${APP_BASE_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  ACCOUNT_SERVICE_URL: http://account:8000
  PRODUCT_SERVICE_URL: http://product:8000
  SENTRY_DSN: ${SENTRY_DSN:-}

x-service-common: &service-common
  restart: unless-stopped
  logging: *logging
  # Replaces the image's HEALTHCHECK, which imports urllib (and with it ssl, email, http) in a
  # fresh interpreter every 30 s in each of 26 API containers. `-S` skips site initialisation
  # and a raw socket needs no imports worth the name; once a minute is plenty for a process
  # that `restart: unless-stopped` already brings back. `start_interval` keeps startup quick.
  healthcheck:
    test:
      - CMD
      - python
      - -S
      - -c
      - |
        import socket, sys
        s = socket.create_connection(("127.0.0.1", 8000), 3)
        s.sendall(b"GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n")
        s.settimeout(3)
        sys.exit(0 if b" 200 " in s.recv(128) else 1)
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 90s
    start_interval: 5s
  security_opt:
    - no-new-privileges:true
  # Not rabbitmq: an API publishes by writing an outbox row and never speaks AMQP, so making
  # every API wait on the broker only meant a broker that would not boot took the whole
  # platform down with it. The processes that do speak AMQP depend on it below.
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # A fuse, not a budget: with no limit anywhere the kernel picks the out-of-memory victim, and
  # the largest process on this box is Postgres. An API here idles at 70–100 MB
  # (`memory-budget.json`'s `kinds.api`, 85 MB expected) — 320m was more than 3x that with
  # nothing to show for the extra headroom, so ADR-0013's memory-budget erratum (2026-09-23)
  # brought it down to 256m: still 3x expected idle, and 26 containers at the old ceiling
  # versus this one cost 1.7 GB of fuse this box does not have to spend.
  mem_limit: 256m

# A background process of a service: a consumer (`bin/worker`), an outbox relay (`bin/relay`)
# or a sweep (`bin/cron`). Same image as the API, no port, and the image's HTTP healthcheck
# disabled because there is nothing listening — `docker compose ps` shows `running`, and the
# outbox depth (runbook, "the outbox fills") is the health signal that matters.
x-background: &background
  <<: *service-common
  healthcheck:
    disable: true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  # Same reasoning as the API fuse above, for the smaller number: a consumer or a sweep idles
  # at 35–50 MB (`memory-budget.json`'s `kinds.background`, 42 MB expected — the edge-relay
  # comment below measured its idle consumers at ~35 MB each). 192m is still 4–5x that.
  mem_limit: 192m
  networks:
    - back

services:
  # ---------------------------------------------------------------- the edge
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3. Harmless if the provider firewall drops it.
    environment:
      # Caddy substitutes {$NAME} at config-load time. The ask endpoint is the one gate on
      # certificate issuance (ADR-0012 §5) and is reached on the compose network, never
      # through the gateway — the gateway's anonymous limiter fails closed, and a Redis
      # outage must not also stop certificate issuance.
      ACME_EMAIL: ${ACME_EMAIL}
      TLS_ASK_URL: http://storefront:8000/api/v1/storefront/internal/tls-authorize
      # Names the one site block that proxies uploaded merchant images (ADR-0009 addendum,
      # 2026-09-23) — see caddy/Caddyfile's "uploaded merchant images" section for why that
      # route lives on this one host and nowhere else.
      EDGE_HOST: ${EDGE_HOST}
      # Drives the @opsgrids_public path matcher, so a bucket rename in `.env` is a one-value
      # change rather than a second hardcoded path to remember and forget.
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-opsgrids-public}
    volumes:
      # A directory, not the file. A single-file bind mount follows the *inode*: when a
      # checkout replaces the file, the container keeps reading the old one, and a deploy
      # that changed only the Caddyfile reloaded exactly what was already running (found on
      # the first deploy). The directory holds nothing but the Caddyfile, so nothing else is
      # exposed by mounting it.
      - ./caddy:/etc/caddy:ro
      # The buyer bundle. Published by `make edge-web`, which builds on a laptop and rsyncs a
      # release directory, then swaps a symlink — so a failed frontend build never reaches the
      # box and a bad bundle is one symlink away from being undone (runbook, "roll back").
      - ${EDGE_WEB_ROOT:-/srv/opsgrids/web}:/srv/web:ro
      # Every certificate, every private key and the ACME account key. Losing this volume is
      # survivable and expensive (ADR-0012 §5): every name re-issues on its next handshake.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - front
    healthcheck:
      # Plain HTTP on the loopback, so this answers "is the process serving" without dragging
      # TLS or DNS into it. `/_edge/health` is defined in the Caddyfile's http:// block.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/_edge/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Never had a limit before ADR-0013's memory-budget erratum (2026-09-23), alongside
    # postgres, rabbitmq and redis below — the four processes big enough that an unbounded one
    # is what the OOM killer reaches for first when something else spikes. Caddy here proxies
    # a handful of domains and streams `/opsgrids-public/*` rather than buffering it
    # (`document`'s comment above); `memory-budget.json`'s `datastores.caddy` puts idle at
    # ~64 MB. `mem_reservation` (a soft limit, only enforced under host-wide memory pressure)
    # is set close to that idle figure so the kernel reclaims from the squeezable API and
    # background containers first — see `datastores.postgres` below for the fuller version of
    # this argument.
    mem_limit: 192m
    mem_reservation: 96m

  # ---------------------------------------------------------------- datastores
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: opsgrids
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opsgrids
      # Read by the init script below, on first boot only.
      OPSGRIDS_DB_PASSWORD: ${OPSGRIDS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The same role and extension bootstrap development uses — one file, so the roles a
      # service pins in its own config exist here too. It hardcodes a development password for
      # every role, which is why 30-role-passwords.sh runs immediately after it.
      - ../../tools/dev-bootstrap/init-db.sql:/docker-entrypoint-initdb.d/20-init.sql:ro
      - ./postgres-init/30-role-passwords.sh:/docker-entrypoint-initdb.d/30-role-passwords.sh:ro
    shm_size: '256mb'
    # ~25 client processes (ADR-0012 erratum 10): the default 100 connections is exceeded the
    # moment the workers start, and the first symptom is "FATAL: sorry, too many clients" on
    # auth — nobody can log in. shared_buffers sized for the box, not for the connection count.
    # Two cores: a parallel sequential scan is contention, not speed, and every parallel worker
    # multiplies work_mem. shared_buffers stays small on purpose — the box has no RAM to spare.
    command:
      [
        'postgres',
        '-c', 'max_connections=400',
        '-c', 'shared_buffers=256MB',
        '-c', 'work_mem=4MB',
        '-c', 'maintenance_work_mem=64MB',
        '-c', 'max_parallel_workers_per_gather=0',
        '-c', 'max_parallel_workers=2',
        '-c', 'autovacuum_max_workers=2',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsgrids -d opsgrids']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 3s
    # Postgres was the one process on this box the OOM killer could reach for first without a
    # limit anywhere else fixing that on its own — it is the biggest thing running, so with no
    # `mem_limit` at all it was also the biggest thing a spike on another container could take
    # down alongside it (ADR-0013's memory-budget erratum, 2026-09-23). `shared_buffers=256MB`
    # above plus the ~25 client processes' own backend memory (`work_mem` × active backends)
    # and OS page cache is what `memory-budget.json`'s `datastores.postgres` prices at ~350 MB
    # idle; 768m leaves over 400 MB of headroom for a real query spike before this container's
    # own limit — not the whole box's — is what gets hit. `mem_reservation` at 512m is the
    # signal the other direction: under host-wide memory pressure, reclaim from the API and
    # background containers (which have none) before this one.
    mem_limit: 768m
    mem_reservation: 512m
    networks:
      - back

  rabbitmq:
    # The plain image, not `-management`: the management plugin samples every connection,
    # channel and queue every five seconds to feed a UI nobody opens, and with ~35 clients on
    # a 2-vCPU box that sampling was the largest single consumer of CPU. `rabbitmqctl` inside
    # the container answers everything the UI did.
    # Pinned to the patch: the data volume outlives the container, RabbitMQ refuses to boot across
    # a minor version without the old version's feature flags enabled, and it cannot be downgraded
    # at all — a floating tag turns a routine deploy into an upgrade nobody planned.
    image: rabbitmq:3.13.7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: opsgrids
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # No published port. To look inside: `docker compose exec rabbitmq rabbitmqctl list_queues`.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # See the file's own header: sets the memory alarm and the disk alarm relative to the
      # `mem_limit` below, not to the box. The `-management` image reads conf.d the same way;
      # this file works unmodified if that image is ever swapped back in.
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-memory.conf:ro
    healthcheck:
      # Every probe starts a second Erlang VM — about a second of CPU — so this runs once a
      # minute, not every ten seconds as it used to. It is still the diagnostics tool and not a
      # port check, because a broker under a memory or disk alarm keeps its port open while
      # blocking every publisher: nothing errors, the outboxes just fill, and a port check
      # would call that healthy and let a deploy record a good ref on top of it.
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms']
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
      start_interval: 10s
    # ADR-0013's memory-budget erratum (2026-09-23): no limit here before meant the second
    # biggest process on the box (after postgres) could grow unbounded. `rabbitmq.conf`
    # (mounted above) keeps the broker's own alarm inside this ceiling; `memory-budget.json`'s
    # `datastores.rabbitmq` prices idle at ~150 MB, so 256m leaves headroom for the alarm to
    # fire and be acted on (queues stop accepting, publishers back up) before Docker's own
    # cgroup limit kills the container outright.
    mem_limit: 256m
    mem_reservation: 192m
    networks:
      - back

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # Append-only because the rate limiter and the 300-second host cache are cheap to lose but
    # annoying to lose at the same time as everything else. maxmemory keeps a runaway key space
    # from competing with Postgres for the box's 3.8 GB.
    #
    # What is actually in here (`libs/platform-core/src/platform_core/cache.py`), because the
    # right eviction policy depends on it and `allkeys-lru` was picked without checking:
    #   * `cache_get`/`cache_set` — soft caches with a TTL (e.g. storefront's 300s slug cache).
    #     A miss falls through to Postgres; losing one of these is invisible.
    #   * `rl:*` — rate-limit counters, also TTL'd (`expire` set the moment a bucket is opened).
    #     Losing one resets a caller's window early: a minor extra allowance, not a correctness
    #     bug.
    #   * `pv:*` (`permission_version_key`) — the organization's permission-version counter,
    #     written with a bare `incr` and **no TTL**. `gateway.py`'s `proxy` (`build_gateway`)
    #     treats a missing `pv:` key as "nothing has changed since this cache was last empty" and
    #     skips the staleness check — so evicting a live `pv:` key under memory pressure is the
    #     same class of bug as `bc7f049` ("stop the permission cache holding a grant back after
    #     activation"), pointed the other way: that fix stopped a stale cache from refusing a
    #     grant that had already landed; losing `pv:*` here would let a *revoked* grant's token
    #     keep being accepted, silently, for as long as it has left to live. That must never be
    #     the key Redis throws away to make room for a slug cache.
    #
    # `volatile-lru` only evicts keys that carry a TTL — the caches and the rate limiter — and
    # returns `OOM command not allowed` on a write once none are left, rather than reaching into
    # `pv:*`. `maxmemory` stays small precisely because nothing here is meant to hold much: a
    # 64 MB dataset limit that fills up is a signal to look at what is being cached, not a
    # reason to widen the policy back to `allkeys-*`.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 3s
    # ADR-0013's memory-budget erratum (2026-09-23). `maxmemory 64mb` above already bounds the
    # dataset; this bounds the process (client buffers, the AOF rewrite's fork, Redis's own
    # bookkeeping) — `memory-budget.json`'s `datastores.redis` prices idle at ~40 MB.
    mem_limit: 128m
    mem_reservation: 64m
    networks:
      - back

  # document-service's public asset store (ADR-0009). Profile `storefront`: today document has
  # exactly one caller — the storefront console's image upload — and this box has no RAM to
  # spare running a bucket for nobody. ADR-0009's "the service surface" calls
  # `/api/v1/documents` a platform route with no product key; that is a statement about
  # entitlement at the gateway, not about which boxes run the service behind it. Move `minio`
  # and `document` out of this profile the day a second product's frontend uploads through them.
  #
  # No host port: a buyer's browser never reaches this container directly. Caddy reverse-proxies
  # `/opsgrids-public/*` straight to it (`caddy/Caddyfile`) because the bucket is meant to be
  # world-readable in its entirety (ADR-0009 §1) — that is a plain, unauthorized proxy of a
  # public bucket, not the authorizing content proxy ADR-0009 §"What this rejects" refuses.
  # `front` as well as `back`, the same shape `storefront` uses for the TLS ask endpoint: Caddy
  # reaches it on `front`, `document` writes and deletes objects on `back`.
  #
  # `quay.io/minio/minio`, not `minio/minio`: Docker Hub no longer serves MinIO's server image —
  # `minio/minio` 404s there now (verified against the registry, not assumed). quay.io is
  # MinIO's own published mirror for the same tags. `tools/dev-bootstrap/compose.yml` already
  # made the same switch (#42).
  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    logging: *logging
    profiles: ['storefront']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # No console in production: nothing here ever needs to browse the bucket by hand, and the
      # console is a second HTTP surface to secure for zero use.
      MINIO_BROWSER: 'off'
    command: ['server', '/data']
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    # A fuse (top-of-file arithmetic): one small bucket, no console, no listing traffic. Capped
    # well below Postgres's share of this box's 3.8 GB.
    mem_limit: 128m
    networks:
      - front
      - back

  # One-shot: creates the public asset bucket and its anonymous GetObject-only policy. Without
  # it the bucket does not exist and the first upload fails at runtime with an opaque
  # NoSuchBucket (ADR-0009 §13, "Bootstrap"). Same recipe as `tools/dev-bootstrap/compose.yml`'s
  # `minio-bootstrap` — keep the two in sync — including *why* it is written as a JSON policy
  # document rather than `mc anonymous set download`: `set download` also grants anonymous
  # `s3:ListBucket`, which is anonymous enumeration and destroys ADR-0009 §3's isolation
  # argument (no listing to walk, a v4 UUID is not guessable). Idempotent: `mb --ignore-existing`
  # and a policy set are both safe to re-run, so a redeploy is a no-op here, not an error.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    profiles: ['storefront']
    # A one-shot: it does its job and exits 0. `remote.sh`'s `health` step treats "exited" as a
    # failure for everything EXCEPT a container carrying this label with exit code 0 — without
    # it, every deploy with the `storefront` profile waited the full HEALTH_TIMEOUT (600s) and
    # failed, skipping `record_ref` and the apps job, because this container's job is to not be
    # running by the time health is checked.
    labels:
      - 'opsgrids.oneshot=true'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # `mc` recognises `MC_HOST_<alias>` on its own — no `mc alias set og http://minio:9000
      # "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"` call needed, which is what this replaces.
      # The old form put the root password on the command line of a process running inside
      # this container for as long as that `mc` invocation ran — readable by anything that can
      # see this container's process list (`docker top`, a shared PID namespace) for that
      # window. An env var `mc` reads directly never appears in argv at all.
      MC_HOST_og: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-opsgrids-public}
      # The scoped credential `document` actually connects with (below), created here rather
      # than handing it the root account: a compromised or merely buggy `document` process can
      # now put and delete objects in this one bucket and nothing more — it cannot list the
      # bucket, cannot touch a second bucket if one is ever added, and cannot change this
      # bucket's own policy out from under `minio-init`.
      DOCUMENT_S3_ACCESS_KEY: ${DOCUMENT_S3_ACCESS_KEY}
      DOCUMENT_S3_SECRET_KEY: ${DOCUMENT_S3_SECRET_KEY}
      # The second scoped credential, held only by `document-cron` (ADR-0009 §9 addendum):
      # `s3:ListBucket` plus `s3:DeleteObject`, so the orphan sweep can list the bucket and
      # remove what it finds. The API's own `document` container never receives this
      # credential and never calls `ListBucket` (`app/storage.py`'s `ObjectStore` vs.
      # `OrphanScanner`) — a compromised or merely buggy API process still cannot enumerate
      # the bucket, which is the whole of ADR-0009 §3's tenancy argument.
      DOCUMENT_S3_ORPHAN_ACCESS_KEY: ${DOCUMENT_S3_ORPHAN_ACCESS_KEY}
      DOCUMENT_S3_ORPHAN_SECRET_KEY: ${DOCUMENT_S3_ORPHAN_SECRET_KEY}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc mb --ignore-existing "og/$$S3_PUBLIC_BUCKET"
        cat > /tmp/public-read.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::$$S3_PUBLIC_BUCKET/*"]
            }
          ]
        }
        JSON
        mc anonymous set-json /tmp/public-read.json "og/$$S3_PUBLIC_BUCKET"
        echo "$$S3_PUBLIC_BUCKET ready: anonymous GetObject only, no ListBucket"

        # The scoped user `document` writes and deletes as (finding: root credential shared
        # with a whole bucket's worth of blast radius). `s3:PutObject` and `s3:DeleteObject`
        # only — `document` never calls GetObject or ListBucket (see `app/storage.py`), and the
        # anonymous policy above already covers every read a buyer's browser needs.
        #
        # Idempotent the way each step actually behaves, verified against this pinned `mc`,
        # not assumed: `admin user add` on an existing user resets its secret to this value
        # rather than erroring, and `admin policy create` on an existing name silently
        # overwrites it — but `admin policy attach` on an already-attached policy errors
        # ("already in effect", exit 1) rather than being a no-op, so that one step's result is
        # checked explicitly instead of trusted to be safe to just re-run.
        #
        # The secret is unavoidably a positional argument to `admin user add` — `mc`'s admin
        # API has no env-var form for it — so it is visible in this container's own process
        # list for the moment this one line runs, same as any `docker run -e PASSWORD=...`
        # secret; it never appears in a log, in `docker inspect`, or in this file.
        mc admin user add og "$$DOCUMENT_S3_ACCESS_KEY" "$$DOCUMENT_S3_SECRET_KEY"
        cat > /tmp/document-write.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$$S3_PUBLIC_BUCKET/*"]
            }
          ]
        }
        JSON
        mc admin policy create og document-write /tmp/document-write.json
        attach_out=$$(mc admin policy attach og document-write --user "$$DOCUMENT_S3_ACCESS_KEY" 2>&1) && echo "$$attach_out" || {
          case "$$attach_out" in
          *"already in effect"*) echo "document-write already attached to the scoped user" ;;
          *)
            echo "$$attach_out" >&2
            exit 1
            ;;
          esac
        }

        # The orphan sweep's own user (ADR-0009 §9 addendum): `s3:ListBucket` on the bucket
        # itself plus `s3:DeleteObject` on its objects — the one capability the write-path
        # user above deliberately does not hold. `document-cron` is the only process this
        # credential is ever handed to (`compose.prod.yml`'s `document-cron`, below); the API
        # container reads only `DOCUMENT_S3_ACCESS_KEY`/`_SECRET_KEY`.
        mc admin user add og "$$DOCUMENT_S3_ORPHAN_ACCESS_KEY" "$$DOCUMENT_S3_ORPHAN_SECRET_KEY"
        cat > /tmp/document-orphan-sweep.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket"],
              "Resource": ["arn:aws:s3:::$$S3_PUBLIC_BUCKET"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$$S3_PUBLIC_BUCKET/*"]
            }
          ]
        }
        JSON
        mc admin policy create og document-orphan-sweep /tmp/document-orphan-sweep.json
        orphan_attach_out=$$(mc admin policy attach og document-orphan-sweep --user "$$DOCUMENT_S3_ORPHAN_ACCESS_KEY" 2>&1) && echo "$$orphan_attach_out" || {
          case "$$orphan_attach_out" in
          *"already in effect"*) echo "document-orphan-sweep already attached to the scoped user" ;;
          *)
            echo "$$orphan_attach_out" >&2
            exit 1
            ;;
          esac
        }
    # A `mc` client doing a handful of admin calls and exiting — `memory-budget.json` marks it
    # `steady_state: false` (it never runs for more than a few seconds) but it still gets a
    # fuse, the same as every other container here.
    mem_limit: 64m
    restart: on-failure
    networks:
      - back

  # ---------------------------------------------------------------- services
  # Each image holds exactly one service's code on top of a shared .venv layer: `import app`
  # is ambiguous across services, so one image can only ever hold one of them.
  auth:
    <<: *service-common
    image: opsgrids-edge/auth
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *service-env
      # The only private signing key in the platform. It is a file on the box, mounted
      # read-only, and it is never in the image, the repository or an environment variable.
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-ed25519.pem
      ADMIN_GATEWAY_HOP_KEY: ${ADMIN_GATEWAY_HOP_KEY:-}
    volumes:
      - ${JWT_PRIVATE_KEY_HOST_PATH}:/run/secrets/jwt-ed25519.pem:ro
    networks:
      - back

  account:
    <<: *service-common
    image: opsgrids-edge/account
    build:
      context: ../..
      dockerfile: services/account/Dockerfile
    environment:
      <<: *service-env
      # Without this, `load_product_manifest` walks up looking for the repository layout,
      # finds none inside the image, and returns None — so activating a product registers no
      # roles and nothing errors. A silent nothing, the same shape as the directory role.
      PERMISSION_MANIFEST_DIR: /opt/opsgrids/permissions
    volumes:
      - ../../libs/contracts/permissions:/opt/opsgrids/permissions:ro
    networks:
      - back

  product:
    <<: *service-common
    image: opsgrids-edge/product
    build:
      context: ../..
      dockerfile: services/product/Dockerfile
    environment: *service-env
    networks:
      - back

  # The Storefront product: profile `storefront` (ADR-0013 §5), like every sellable product.
  storefront:
    <<: *service-common
    profiles: ['storefront']
    image: opsgrids-edge/storefront
    build:
      context: ../..
      dockerfile: services/storefront/Dockerfile
    environment:
      <<: *service-env
      STORE_SLUG_CACHE_SECONDS: ${STORE_SLUG_CACHE_SECONDS:-300}
      # The platform's own hostnames the ask endpoint may say yes to. A store answers for
      # itself; these names are nobody's store and would otherwise never get a certificate.
      TLS_PLATFORM_HOSTS: ${TLS_PLATFORM_HOSTS}
      # What `GET /store/domain`'s `dns` block tells a merchant to publish (ADR-0012 §4, §11):
      # the ALIAS target and the literal A-record fallback, from the box's own `.env`. `EDGE_HOST`
      # is always there (`remote.sh` refuses to deploy without it); `EDGE_RESERVED_IP` may not be,
      # so it defaults to empty and the routing probe then accepts whatever `EDGE_HOST` resolves to.
      EDGE_HOST: ${EDGE_HOST}
      EDGE_RESERVED_IP: ${EDGE_RESERVED_IP:-}
    networks:
      # `front` as well as `back`: Caddy calls this container directly for the on-demand TLS
      # ask endpoint, deliberately bypassing the gateway (ADR-0012 §5).
      - front
      - back

  # The sweep (ADR-0012 §6): the three probes, the state machine, and the release of claims that
  # expired. Its own process, because a poll loop must not share a pool with request traffic —
  # and its own container so `docker compose ps` answers "is anything checking the domains"
  # without reading code.
  #
  # `bin/cron` runs `python -m app.cron` and refuses to start at all (exit 78) if that module is
  # missing from the image — the scaffold's `python -m app.relay` would otherwise be a process
  # that looks healthy while no domain is ever checked and nothing errors, and that failure mode
  # is exactly why the check exists rather than trusting this comment.
  #
  # Same profile as `storefront` rather than its own `sweep` profile: a box that sells the
  # storefront product always needs the sweep running, and a box that does not sell it never
  # needs a cron container that would find nothing to check.
  storefront-cron:
    <<: *service-common
    profiles: ['storefront']
    image: opsgrids-edge/storefront
    command: ['./bin/cron']
    environment:
      <<: *service-env
      STORE_SLUG_CACHE_SECONDS: ${STORE_SLUG_CACHE_SECONDS:-300}
      EDGE_HOST: ${EDGE_HOST}
      EDGE_RESERVED_IP: ${EDGE_RESERVED_IP:-}
      # Where the certificate probe dials, SNI set to the domain under test — Caddy on the
      # `front` network, never out through the internet (ADR-0012 §6). The compose service name
      # doubles as its own DNS name on the network, so this needs no value from `.env`.
      TLS_PROBE_HOST: caddy
      TLS_PROBE_PORT: '443'
    # No healthcheck: the image's is an HTTP probe against a port this process does not open.
    healthcheck:
      disable: true
    networks:
      - front # the certificate probe handshakes against Caddy with SNI set (ADR-0012 §6)
      - back

  app-gateway:
    <<: *service-common
    image: opsgrids-edge/app-gateway
    build:
      context: ../..
      dockerfile: services/app-gateway/Dockerfile
    environment:
      <<: *service-env
      # The committed `services/app-gateway/routes.json` points every upstream at localhost,
      # which is correct for development and wrong in a container. `routes.prod.json` names
      # the five services that are actually deployed and nothing else, so a request for an
      # undeployed product is a 404 from the gateway rather than a hung connection.
      ROUTES_FILE: /opt/opsgrids/routes.prod.json
      # The gateway reads the route table once, at start, and the table arrives through a bind
      # mount — so an edit to it changes nothing compose can see, `up` leaves the container
      # alone, and a deploy that only added a product's routes used to deploy nothing: the
      # product's app answered "No route for /api/v1/…" until something else forced a
      # recreate. `remote.sh` exports the file's hash; a changed table is a changed container.
      ROUTES_SHA: ${ROUTES_SHA:-unset}
    volumes:
      - ./routes.prod.json:/opt/opsgrids/routes.prod.json:ro
    networks:
      - front
      - back

  # ---------------------------------------------------------------- core: workers and the relay
  # ADR-0013 §5. A worker only where the service has event handlers (auth, catalog, billing,
  # metering, operations, storefront and document have none today); every outbox is drained, so nothing
  # a service publishes sits in its table forever — by the one `edge-relay` below. Each worker
  # reuses its API's image by name — the build step builds each image once, and `up` finds it.
  # One process drains every service's outbox (platform_core.edge_relay). A relay per service
  # is the platform's default and what `bin/relay` still is everywhere else; on this box it was
  # 24 idle Python processes, ~35 MB each — about 800 MB the machine was swapping for. They
  # all did the same thing against a different schema, as the same `opsgrids_outbox` role, so
  # here one process runs them as tasks: a schema that fails or has no table yet is logged,
  # retried on its own and never stops the others. It runs in the product image only because
  # that image is always built; it imports no service's `app`. The list names every schema a
  # product on this box can own — a profile that is off simply has no table to drain.
  edge-relay:
    <<: *background
    image: opsgrids-edge/product
    command: ['python', '-m', 'platform_core.edge_relay']
    environment:
      <<: *service-env
      EDGE_RELAY_SCHEMAS: ${EDGE_RELAY_SCHEMAS:-auth,account,product,catalog,subscription,billing,metering,payment,notification,storefront,document,operations,approval,employee,attendance,leave,customer,deal,lead,project,timesheet,standup,projects,support,marketing,finance,scheduler,itsm}
    depends_on:
      product:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # C10: the box's own ops monitor (R7 hysteresis alerting, R12 metrics, R37's backup/cron
  # visibility) — nothing here before this slice paged anybody (RUNBOOK.md used to say so in
  # capitals; see "alerts and what each means" for what replaced that). Same trick as
  # `edge-relay` above: no new image, `python -m platform_core.ops_monitor` in the always-built
  # `product` image, importing no service's `app`.
  #
  # `mem_limit: 128m`, not `*background`'s 192m — `memory-budget.json`'s `ops_monitor` entry
  # has the arithmetic: the full-profile budget was already at ~94% before this container
  # existed, and 128m is what keeps it under the 100% hard line. Its own state is a JSON file
  # under the bind mount below, never the database — it has to keep working when Postgres is
  # the thing it is watching.
  #
  # `front` as well as `back`, the same shape `storefront-cron`'s certificate probe already
  # uses and for the identical reason: the certificate-expiry check handshakes against Caddy on
  # `front` with SNI set (see `checks.check_cert_expiry`). This is network *reachability*, not
  # exposure — nothing publishes this container's port, and neither the Caddyfile nor either
  # gateway's route table ever names it (`tests/infra/test_metrics_never_routed.py` is the
  # lint). `/metrics` and `/status` stay reachable only to whatever else is already on `back`.
  #
  # No `user:` override (round 2's M2 decision) — this box's `deploy` user is not reliably
  # uid 1000 the way a fresh Ubuntu box's first human user would be (Azure's own provisioning
  # already takes uid 1000 for `azureuser`, so `deploy`, created after it, is likely 1001), so
  # a fixed uid guess here would be as wrong as the image's own baked-in one. Instead this runs
  # as the image's own `opsgrids` system user (uid 999, the same one the JWT signing key's
  # setup already discovers dynamically — RUNBOOK.md, "standing up a new box" step 5), and
  # `remote.sh up`'s `ensure_ops_monitor_state_dir` creates and chowns exactly one directory
  # for it: `/srv/opsgrids/state/ops-monitor`, mounted `rw` below. The state directory's own
  # root stays mounted `ro` — this process only ever needs to read `backup.last-ok` from it,
  # never write there, and `deploy`'s own `last-good-ref`/`deploy-log` stay untouched by any of
  # this. `preflight.sh` checks the subdirectory's ownership and warns (not refuses) if a
  # deploy has not run yet to fix it. A state or heartbeat write that fails anyway (a full
  # disk) is logged and does not crash the loop — see `main._dump_safely`/`_write_heartbeat_safely`.
  #
  # Deliberately NOT `<<: *service-env` (m11): this process touches no PII, mints no internal
  # service token, and calls no other service's `/internal/*` route, so it is handed none of
  # `INTERNAL_SERVICE_TOKEN`, `PII_ENCRYPTION_KEY`/`PII_DECRYPT_KEYS`, `JWT_*`,
  # `APP_BASE_URL`/`CORS_ORIGINS` or either directory service URL — the smallest environment
  # that can still open the outbox engine, reach the broker and send mail.
  ops-monitor:
    <<: *background
    image: opsgrids-edge/product
    command: ['python', '-m', 'platform_core.ops_monitor']
    environment:
      ENVIRONMENT: production
      DEBUG: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: 'true'
      DATABASE_URL: postgresql+asyncpg://opsgrids_app:${OPSGRIDS_DB_PASSWORD}@postgres:5432/opsgrids
      RABBITMQ_URL: amqp://opsgrids:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      MALLOC_ARENA_MAX: '2'
      MALLOC_TRIM_THRESHOLD_: '131072'
      EDGE_RELAY_SCHEMAS: ${EDGE_RELAY_SCHEMAS:-auth,account,product,catalog,subscription,billing,metering,payment,notification,storefront,document,operations,approval,employee,attendance,leave,customer,deal,project,timesheet,standup,projects,support,marketing,finance,scheduler,itsm}
      # B1 (round 2): the same variable docker compose itself already reads to decide which
      # containers to start — one source of truth for "what does this box run", so
      # OpsMonitorSettings can derive exactly which API containers/DLQ queues SHOULD exist
      # (`config.expected_api_containers`/`expected_dlq_queues`) instead of guessing. A name
      # that should exist and does not resolve is now a real failure, never skipped — Docker's
      # embedded DNS drops a crashed or OOM-killed container the same way it drops one that was
      # never started, so "does not resolve" cannot mean "not deployed" any more.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # Empty means "derive from COMPOSE_PROFILES above" — set explicitly only to narrow or add
      # to that computed list; doing so REPLACES it entirely. See .env.example's own comment.
      OPS_MONITOR_API_CONTAINERS: ${OPS_MONITOR_API_CONTAINERS:-}
      OPS_MONITOR_DLQ_QUEUES: ${OPS_MONITOR_DLQ_QUEUES:-}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      EDGE_HOST: ${EDGE_HOST}
      OPS_MONITOR_CERT_HOST: caddy
      OPS_MONITOR_CERT_PORT: '443'
      OPS_MONITOR_PORT: '9110'
      OPS_MONITOR_STATE_PATH: /srv/opsgrids/state/ops-monitor/ops-monitor.json
      OPS_MONITOR_HEARTBEAT_PATH: /srv/opsgrids/state/ops-monitor/ops-monitor.heartbeat
      OPS_MONITOR_BACKUP_MARKER_PATH: /srv/opsgrids/state/backup.last-ok
    volumes:
      # Root read-only (this process only ever reads backup.last-ok from it), the one
      # subdirectory it owns mounted read-write on top — see the block comment above for why
      # this is two mounts and who chowns the second one.
      - ${EDGE_STATE_DIR:-/srv/opsgrids/state}:/srv/opsgrids/state:ro
      - ${EDGE_STATE_DIR:-/srv/opsgrids/state}/ops-monitor:/srv/opsgrids/state/ops-monitor:rw
    # Overrides `*background`'s disabled healthcheck: unlike a relay or a sweep, this process
    # writes a heartbeat file every cycle specifically so `docker compose ps` can answer "is the
    # loop still turning" without reading logs — three missed 60s cycles (`-mmin -3`) is a
    # stuck loop, not a slow one.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'find /srv/opsgrids/state/ops-monitor/ops-monitor.heartbeat -mmin -3 2>/dev/null | grep -q .',
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    networks:
      - front # the certificate probe handshakes against Caddy with SNI set (same as storefront-cron)
      - back
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Runs both the product-activation consumer and the periodic domain re-verification sweep
  # since ADR-0013's memory-budget erratum (2026-09-23) — the same merge `subscription-worker`
  # already documents. `app/worker.py` `gather`s the two; `bin/cron` (`app/cron.py`) still runs
  # the sweep alone for local debugging, on no container of its own.
  account-worker:
    <<: *background
    image: opsgrids-edge/account
    command: ['./bin/worker']
    environment:
      <<: *service-env
      PERMISSION_MANIFEST_DIR: /opt/opsgrids/permissions
    volumes:
      - ../../libs/contracts/permissions:/opt/opsgrids/permissions:ro

  product-worker:
    <<: *background
    image: opsgrids-edge/product
    command: ['./bin/worker']
    environment: *service-env

  # ---------------------------------------------------------------- commerce (ADR-0004)
  catalog:
    <<: *service-common
    image: opsgrids-edge/catalog
    build:
      context: ../..
      dockerfile: services/catalog/Dockerfile
    environment: *service-env
    networks:
      - back

  subscription:
    <<: *service-common
    image: opsgrids-edge/subscription
    build:
      context: ../..
      dockerfile: services/subscription/Dockerfile
    environment:
      <<: *service-env
      CATALOG_SERVICE_URL: http://catalog:8000
    networks:
      - back

  # Runs the payment-event consumer (app/consumers.py), the dunning sweep (app/cron.py's
  # DunningSweep, ADR-0005) and the billing run — trial end, period roll, one invoice per period
  # (app/billing_run.py, ADR-0005's 2026-09-23 addendum and ADR-0013 §6) — in one process,
  # app/worker.py, `gather`ed the way notification/app/worker.py combines its two consumers.
  # The billing run calls billing and payment over their internal APIs, never holding a
  # database transaction open across a call.
  # ADR-0013's memory-budget erratum (2026-09-23): these were two containers
  # (`subscription-worker` on `./bin/worker`, `subscription-cron` on `./bin/cron`) at 192m
  # apiece for two processes that are each idle almost all the time. `bin/cron` still points at
  # `app.cron` unchanged and runs standalone for local debugging; only `bin/worker` moved.
  subscription-worker:
    <<: *background
    image: opsgrids-edge/subscription
    command: ['./bin/worker']
    environment:
      <<: *service-env
      CATALOG_SERVICE_URL: http://catalog:8000
      BILLING_SERVICE_URL: http://billing:8000
      PAYMENT_SERVICE_URL: http://payment:8000
      # The billing run's kill switch, OFF unless .env turns it on — see the runbook's "The
      # billing run" before turning it on: the first passes convert every expired trial and bill
      # every overdue period.
      BILLING_RUN_ENABLED: ${BILLING_RUN_ENABLED:-false}
      # The billing cutover, required once the run is on (the worker refuses to start the run
      # without it): nothing that began before it is invoiced. See the runbook.
      BILLING_RUN_NOT_BEFORE: ${BILLING_RUN_NOT_BEFORE:-}

  # Prices the billing run's invoices off the pinned catalog version and metering's usage for the
  # closed period. BILLING_TAX_CODE unset means no tax line (ADR-0004 "Open: Tax"); set it (and
  # BILLING_TAX_JURISDICTION) only once a rate row for it exists in billing.tax_rates.
  billing:
    <<: *service-common
    image: opsgrids-edge/billing
    build:
      context: ../..
      dockerfile: services/billing/Dockerfile
    environment:
      <<: *service-env
      CATALOG_SERVICE_URL: http://catalog:8000
      METERING_SERVICE_URL: http://metering:8000
      BILLING_TAX_CODE: ${BILLING_TAX_CODE:-}
      BILLING_TAX_JURISDICTION: ${BILLING_TAX_JURISDICTION:-}
    networks:
      - back

  metering:
    <<: *service-common
    image: opsgrids-edge/metering
    build:
      context: ../..
      dockerfile: services/metering/Dockerfile
    environment: *service-env
    networks:
      - back

  # Inert without Razorpay keys, by design (payment/app/config.py): every charge path runs and
  # nothing reaches the network. The webhook secret must still be a real value — production
  # refuses the dev-only default — so it is generated on the box like every other secret.
  payment:
    <<: *service-common
    image: opsgrids-edge/payment
    build:
      context: ../..
      dockerfile: services/payment/Dockerfile
    environment: &payment-env
      <<: *service-env
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    networks:
      - back

  payment-worker:
    <<: *background
    image: opsgrids-edge/payment
    command: ['./bin/worker']
    environment: *payment-env

  # ---------------------------------------------------------------- notification (platform)
  # Email is what turns a signup into a password (ADR-0013 §3) and a trial's end into a
  # warning. `EMAIL_TRANSPORT=log` renders and records every message and sends nothing — the
  # honest state until SMTP credentials exist, and preflight says so in capitals.
  notification:
    <<: *service-common
    image: opsgrids-edge/notification
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile
    environment: &notification-env
      <<: *service-env
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      WHATSAPP_TRANSPORT: ${WHATSAPP_TRANSPORT:-log}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      # customer-service is deployed under the `crm` profile only; on a box without it enabled
      # the phone lookup answers unavailable, not wrong.
      CUSTOMER_INTERNAL_URL: http://customer:8000
      # Engage (services/notification/app/services.py's `request_send`/`_check_public_base`):
      # both must be real before a campaign can be sent at all outside `local`/`test`/`ci` — an
      # unsigned or `http://`/`localhost` link is refused at the send gate, not just warned
      # about. Generate ENGAGE_UNSUBSCRIBE_SECRET fresh; rotating it invalidates every
      # unsubscribe link already sent, so treat it like any other signing secret.
      ENGAGE_UNSUBSCRIBE_SECRET: ${ENGAGE_UNSUBSCRIBE_SECRET}
      ENGAGE_PUBLIC_API_BASE: ${ENGAGE_PUBLIC_API_BASE}
    networks:
      - back

  # notification's `bin/worker` runs its two consumers (events → messages, and the dispatcher)
  # in one process; see services/notification/app/worker.py.
  notification-worker:
    <<: *background
    image: opsgrids-edge/notification
    command: ['./bin/worker']
    environment: *notification-env

  # The campaign send driver (app/cron.py). Its own process for the same reason every other
  # sweep here is: a poll loop must not share a pool with request traffic, and `docker compose
  # ps` should answer "is anything sending campaigns" without reading code.
  notification-cron:
    <<: *background
    image: opsgrids-edge/notification
    command: ['./bin/cron']
    environment: *notification-env

  # ---------------------------------------------------------------- document (platform asset store; ADR-0009)
  # `/api/v1/documents` carries no `product` key in routes.prod.json — the same shape as
  # `/api/v1/members` — because ADR-0009 makes it a platform surface, not a per-product one.
  # It still sits behind the `storefront` profile here: see the comment on `minio` above for
  # why that is a compose-deployment decision and not a contradiction of the ADR.
  #
  # No `document-worker`: `app/consumers.py` is the generic per-service scaffold and registers
  # no handler, matching catalog, billing, metering, operations and storefront (the comment on
  # `edge-relay` below). An idle worker holding an open broker channel for nothing is 30 MB this
  # box does not have to give away.
  #
  # `bin/cron` runs the purge sweep (ADR-0009 §8, and its 2026-09-23 addendum's §9 orphan
  # pass) — see `document-cron`, below, for that container. This block is the API only.
  document:
    <<: *service-common
    profiles: ['storefront']
    image: opsgrids-edge/document
    build:
      context: ../..
      dockerfile: services/document/Dockerfile
    # `memswap_limit` equal to `mem_limit` gives this container zero swap of its own (the
    # value is total memory+swap, so setting it equal to `mem_limit` allows none). Every other
    # service here inherits Docker's default of roughly double `mem_limit` in swap, which is
    # the right choice for a mostly-idle API — but `document` is the one process on this box
    # that decodes attacker-sized images (ADR-0009 §5, §11), and swapping a 300+ MB spike onto
    # this already-swapping 2 vCPU / 3.8 GB box turns one large upload into a slow box for
    # everyone. Failing fast with an OOM kill (`docker compose logs document` shows exit 137;
    # `restart: unless-stopped` brings it back, and the request that caused it gets a 503
    # rather than a slow death for the whole VM) is the trade this container should make.
    memswap_limit: 320m
    environment:
      <<: *service-env
      # Reached over the compose network, never through Caddy: writes and deletes never need
      # the public path `/opsgrids-public/*` proxies (that path is anonymous GetObject only).
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-opsgrids-public}
      # The scoped user `minio-init` creates (above), not the MinIO root account: `s3:PutObject`
      # and `s3:DeleteObject` on this one bucket's objects, nothing else. A compromised or
      # merely buggy `document` process can no longer list the bucket, touch a second bucket,
      # or rewrite this bucket's own anonymous-read policy — the blast radius the root
      # credential used to hand it for free.
      S3_ACCESS_KEY: ${DOCUMENT_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${DOCUMENT_S3_SECRET_KEY}
      # The absolute address returned as `AssetOut.public_url` for the editor's own immediate
      # preview only (never persisted — ADR-0009 §6). Must be a host Caddy actually proxies
      # `/opsgrids-public/*` on; see `.env.example`.
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - back

  # The purge sweep (ADR-0009 §8, and its 2026-09-23 addendum's §9 orphan pass). Its own
  # process for the same reason every other sweep here is: a poll loop must not share a pool
  # with request traffic, and `docker compose ps` should answer "is anything purging assets"
  # without reading code. Same profile as `document` — a box that runs the asset store always
  # needs its own housekeeping, and a box that does not sell Storefront never needs a cron
  # container that would find nothing to purge.
  #
  # Two credentials, deliberately not one: `S3_ACCESS_KEY`/`_SECRET_KEY` are the same
  # write-only pair the `document` API holds, for the row-purge pass's own `DeleteObject`
  # call; `S3_ORPHAN_ACCESS_KEY`/`_SECRET_KEY` are the second, list-capable pair `minio-init`
  # creates above, held **only** by this container. `document`'s own API process never
  # receives the orphan credential and never calls `ListBucket` — ADR-0009 §3's tenancy
  # argument depends on nothing on the request path being able to enumerate the bucket.
  document-cron:
    <<: *background
    profiles: ['storefront']
    image: opsgrids-edge/document
    command: ['./bin/cron']
    environment:
      <<: *service-env
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-opsgrids-public}
      S3_ACCESS_KEY: ${DOCUMENT_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${DOCUMENT_S3_SECRET_KEY}
      S3_ORPHAN_ACCESS_KEY: ${DOCUMENT_S3_ORPHAN_ACCESS_KEY:-}
      S3_ORPHAN_SECRET_KEY: ${DOCUMENT_S3_ORPHAN_SECRET_KEY:-}
      ASSET_PURGE_RETENTION_DAYS: ${ASSET_PURGE_RETENTION_DAYS:-30}
      # Off, and reporting-only even once on — see `app/config.py`'s own docstring for why an
      # automated, bucket-wide delete earns that much caution before an operator trusts it
      # with a real `DeleteObject`. Both flip independently, from `.env`, with no image change.
      ORPHAN_SWEEP_ENABLED: ${DOCUMENT_ORPHAN_SWEEP_ENABLED:-false}
      ORPHAN_SWEEP_DRY_RUN: ${DOCUMENT_ORPHAN_SWEEP_DRY_RUN:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------------------------------------------------------------- products behind profiles
  # One profile per sellable product (ADR-0013 §5). COMPOSE_PROFILES in the box's .env turns a
  # profile on; the catalogue's `status` says whether the product is sold; preflight refuses a
  # deploy where the two disagree. `operations` is the Inventory product.
  operations:
    <<: *service-common
    profiles: ['inventory']
    image: opsgrids-edge/operations
    build:
      context: ../..
      dockerfile: services/operations/Dockerfile
    environment: *service-env
    networks:
      - back

  # The nightly stock ledger ↔ balance reconciliation (ADR-0014 §3). Records and alerts on
  # drift (`inventory.reconcile.drift` at error level, an `inventory_discrepancies` row, an
  # `operations.inventory.inconsistency_detected` event); never repairs it. Discovery runs on
  # the outbox role, which holds `SELECT (organization_id)` on the ledger tables and nothing more.
  operations-cron:
    <<: *background
    profiles: ['inventory']
    image: opsgrids-edge/operations
    command: ['./bin/cron']
    environment: *service-env

  # ---------------------------------------------------------------- the other products
  # One compose profile per product, named after the product's catalogue key (ADR-0013 §5), so
  # COMPOSE_PROFILES reads as the list of products this box sells. Every product service runs
  # its API (`edge-relay` drains its outbox); a worker runs only where it consumes other services'
  # events (attendance follows approvals, finance follows filings) — an idle worker is 30 MB of
  # RAM holding a broker channel for nothing. Helper services still just the generated scaffold
  # (quotation) are deliberately absent: a prefix that is not routed is an honest 404, a service
  # that answers only /info is a 404 dressed as a product. `pipeline` and `activity` are not
  # scaffolds pending a build — ADR-0017 deletes them outright, since `deal` already owns
  # `crm.pipeline.*` end to end; `lead` graduated out of this list and runs below, under `crm`.
  # ---------------------------------------------------------------- OpsGrids People (profile `hrms`)
  # The approval engine is core, not an HRMS feature — but People is the only product on this
  # box that routes requests through it (attendance regularisation, and the app's approvals
  # screens), so it runs when People does. Its worker keeps the reporting-line copy current
  # from employee events; its cron is the SLA escalation sweep.
  approval:
    <<: *service-common
    profiles: ['hrms']
    image: opsgrids-edge/approval
    build:
      context: ../..
      dockerfile: services/approval/Dockerfile
    environment: *service-env
    networks:
      - back

  # Runs both the hierarchy/regularization consumer (app/consumers.py) and the SLA escalation
  # sweep (app/cron.py's EscalationSweep, ADR-0006 §8) in one process — app/worker.py, the same
  # `gather` shape notification/app/worker.py and subscription/app/worker.py already use.
  # ADR-0013's memory-budget erratum (2026-09-23) folded `approval-cron` into this container;
  # `bin/cron` is unchanged and still runs `app.cron` standalone for local debugging.
  approval-worker:
    <<: *background
    profiles: ['hrms']
    image: opsgrids-edge/approval
    command: ['./bin/worker']
    environment: *service-env

  employee:
    <<: *service-common
    profiles: ['hrms']
    image: opsgrids-edge/employee
    build:
      context: ../..
      dockerfile: services/employee/Dockerfile
    environment: *service-env
    networks:
      - back

  attendance:
    <<: *service-common
    profiles: ['hrms']
    image: opsgrids-edge/attendance
    build:
      context: ../..
      dockerfile: services/attendance/Dockerfile
    environment: *service-env
    networks:
      - back

  attendance-worker:
    <<: *background
    profiles: ['hrms']
    image: opsgrids-edge/attendance
    command: ['./bin/worker']
    environment: *service-env

  leave:
    <<: *service-common
    profiles: ['hrms']
    image: opsgrids-edge/leave
    build:
      context: ../..
      dockerfile: services/leave/Dockerfile
    environment: *service-env
    networks:
      - back

  leave-worker:
    <<: *background
    profiles: ['hrms']
    image: opsgrids-edge/leave
    command: ['./bin/worker']
    environment: *service-env

  # ---------------------------------------------------------------- OpsGrids Revenue (profile `crm`)
  customer:
    <<: *service-common
    profiles: ['crm']
    image: opsgrids-edge/customer
    build:
      context: ../..
      dockerfile: services/customer/Dockerfile
    environment: *service-env
    networks:
      - back

  # Binds `crm.pipeline.activity.logged` (deal-service) to advance `contacts.last_activity_at`
  # (app/consumers.py). The consumer has existed since deal started publishing that event, but
  # this container was never added — ADR-0017 closes that gap. No relay of its own: it consumes,
  # it does not publish, so it runs NOBYPASSRLS on the per-message tenant GUC like every consumer.
  customer-worker:
    <<: *background
    profiles: ['crm']
    image: opsgrids-edge/customer
    command: ['./bin/worker']
    environment: *service-env

  deal:
    <<: *service-common
    profiles: ['crm']
    image: opsgrids-edge/deal
    build:
      context: ../..
      dockerfile: services/deal/Dockerfile
    environment: *service-env
    networks:
      - back

  # The lead half of the `crm` product (ADR-0017). Publishes only — `crm.lead.converted` — and
  # consumes nothing, so no dedicated worker: `edge-relay` drains its outbox like every other
  # service that has no consumer of its own. Calls customer's and deal's `/internal/v1` on
  # `:convert`, under a short-lived service token, the same shape notification uses to call
  # customer today.
  lead:
    <<: *service-common
    profiles: ['crm']
    image: opsgrids-edge/lead
    build:
      context: ../..
      dockerfile: services/lead/Dockerfile
    environment:
      <<: *service-env
      CUSTOMER_INTERNAL_URL: http://customer:8000
      DEAL_INTERNAL_URL: http://deal:8000
    networks:
      - back

  # ---------------------------------------------------------------- PulseBoard (profile `pulseboard`)
  project:
    <<: *service-common
    profiles: ['pulseboard']
    image: opsgrids-edge/project
    build:
      context: ../..
      dockerfile: services/project/Dockerfile
    environment: *service-env
    networks:
      - back

  timesheet:
    <<: *service-common
    profiles: ['pulseboard']
    image: opsgrids-edge/timesheet
    build:
      context: ../..
      dockerfile: services/timesheet/Dockerfile
    environment: *service-env
    networks:
      - back

  standup:
    <<: *service-common
    profiles: ['pulseboard']
    image: opsgrids-edge/standup
    build:
      context: ../..
      dockerfile: services/standup/Dockerfile
    environment: *service-env
    networks:
      - back

  # ---------------------------------------------------------------- OpsGrids Projects (profile `projects`)
  projects:
    <<: *service-common
    profiles: ['projects']
    image: opsgrids-edge/projects
    build:
      context: ../..
      dockerfile: services/projects/Dockerfile
    environment: *service-env
    networks:
      - back

  # ---------------------------------------------------------------- OpsGrids Support (profile `support`)
  support:
    <<: *service-common
    profiles: ['support']
    image: opsgrids-edge/support
    build:
      context: ../..
      dockerfile: services/support/Dockerfile
    environment: *service-env
    networks:
      - back

  # ---------------------------------------------------------------- OpsGrids Marketing (profile `marketing`)
  marketing:
    <<: *service-common
    profiles: ['marketing']
    image: opsgrids-edge/marketing
    build:
      context: ../..
      dockerfile: services/marketing/Dockerfile
    environment: *service-env
    networks:
      - back

  # ---------------------------------------------------------------- OpsGrids Finance (profile `finance`)
  finance:
    <<: *service-common
    profiles: ['finance']
    image: opsgrids-edge/finance
    build:
      context: ../..
      dockerfile: services/finance/Dockerfile
    environment: *service-env
    networks:
      - back

  finance-worker:
    <<: *background
    profiles: ['finance']
    image: opsgrids-edge/finance
    command: ['./bin/worker']
    environment: *service-env
    # `service_started`, not `service_healthy`: `scheduler` has no HTTP healthcheck to report
    # one (`*background`'s is disabled). This only orders container *creation* — it does not
    # wait for `scheduler`'s own `assert_app_role`/`assert_outbox_role` startup checks to pass
    # — so a `not_before` retry staged before `scheduler`'s consumer has actually finished
    # booting still queues normally on finance's own outbox (ADR-0015 §6: the guaranteed-
    # routing channel is what protects that gap, not this ordering); this only avoids the
    # avoidable case of `finance-worker` starting before `scheduler`'s image even exists.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      scheduler:
        condition: service_started

  # ADR-0015: the delayed-delivery primitive, and finance's e-Invoice retry backoff is its first
  # (and today, only) producer of `platform.schedule.requested` — so it ships behind the same
  # `finance` profile finance does, not as platform core. It has no HTTP surface of its own
  # (nothing outside the platform calls it), so unlike every other product on this box there is
  # no plain `scheduler:` API container — one process, `./bin/worker`, runs both the event
  # consumer and the due-job sweep (`app/worker.py`), because the edge box has no RAM to spare
  # for a second idle container doing work this light. Named literally `scheduler` — matching the
  # schema name — so `remote.sh`'s per-service migration gating (`configured_services`) finds it
  # the same way it finds every other service that owns a schema.
  scheduler:
    <<: *background
    profiles: ['finance']
    image: opsgrids-edge/scheduler
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
    command: ['./bin/worker']
    environment: *service-env

  # ---------------------------------------------------------------- OpsGrids IT (profile `itsm`)
  itsm:
    <<: *service-common
    profiles: ['itsm']
    image: opsgrids-edge/itsm
    build:
      context: ../..
      dockerfile: services/itsm/Dockerfile
    environment: *service-env
    networks:
      - back

networks:
  # Caddy reaches the gateway and storefront. It has no route to Postgres or Redis, and
  # neither does anything else outside `back`.
  front:
  back:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
