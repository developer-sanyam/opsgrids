  # ---------------------------------------------------------------- OpsGrids Finance (profile `finance`)
  # No new `depends_on` for the filing consumer and the filing-reclaim sweep this container now
  # runs (`RUN_CONSUMERS_IN_API`, `services/finance/app/main.py`), even though it now speaks
  # AMQP where a plain API never did: `*service-common`'s own comment ("Not rabbitmq: ... a
  # broker that would not boot took the whole platform down with it") still holds. The folded
  # consumer's `EventConsumer.run()` uses `aio_pika.connect_robust`, and the whole group is
  # wrapped in `platform_core.supervise.run_supervised_forever` — a broker that is not ready yet
  # is a caught, logged, backed-off retry inside that task, never a reason this API fails to
  # start or serve a single request. The same reasoning covers `scheduler: service_started`,
  # which `finance-worker` (below) keeps only for its own, no-longer-load-bearing build-ordering
  # reason.
  finance:
    <<: *service-common
    stop_grace_period: 30s
    profiles: ['finance']
    image: opsgrids-edge/finance
    build:
      context: ../..
      dockerfile: services/finance/Dockerfile
    environment: *service-env
    networks:
      - back

  # Runs the filing consumer *and* the filing-reclaim sweep (D3), supervised in one process —
  # app/worker.py. The consumer marks a message processed in its claim transaction, so the
  # queue never retries a crashed claim; the sweep is what finishes it, and it must run
  # wherever finance runs. Folded in here rather than a `finance-cron` container: no memory
  # budget change. `bin/cron` still runs the sweep alone for local debugging.
  #
  # Off by default — see `account-worker`'s own comment. `profiles: ['split-workers']` replaces
  # `['finance']` here: both loops now run inside `finance`'s own API process
  # (`services/finance/app/main.py`) — see that service's own block, below, for why it gains no
  # new `depends_on` even though it now speaks AMQP; this container is the `split-workers`
  # rollback.
  finance-worker:
    <<: *background
    profiles: ['split-workers']
    image: opsgrids-edge/finance
    command: ['./bin/worker']
    environment: *service-env
    # `service_started`, not `service_healthy`: `scheduler` has no HTTP healthcheck to report
    # one (`*background`'s is disabled). This only orders container *creation* — it does not
    # wait for `scheduler`'s own `assert_app_role`/`assert_outbox_role` startup checks to pass
    # — so a `not_before` retry staged before `scheduler`'s consumer has actually finished
    # booting still queues normally on finance's own outbox (ADR-0015 §6: the guaranteed-
    # routing channel is what protects that gap, not this ordering); this only avoids the
    # avoidable case of `finance-worker` starting before `scheduler`'s image even exists.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      scheduler:
        condition: service_started

  # ADR-0015: the delayed-delivery primitive, and finance's e-Invoice retry backoff is its first
  # (and today, only) producer of `platform.schedule.requested` — so it ships behind the same
  # `finance` profile finance does, not as platform core. It has no HTTP surface of its own
  # (nothing outside the platform calls it), so unlike every other product on this box there is
  # no plain `scheduler:` API container — one process, `./bin/worker`, runs both the event
  # consumer and the due-job sweep (`app/worker.py`), because the edge box has no RAM to spare
  # for a second idle container doing work this light. Named literally `scheduler` — matching the
  # schema name — so `remote.sh`'s per-service migration gating (`configured_services`) finds it
  # the same way it finds every other service that owns a schema.
  #
  # Also behind `split-workers`: `finance-worker` (below) depends on this service existing, and
  # that container now runs behind `split-workers` rather than `finance` (the worker-folding
  # follow-up to the memory-headroom slice). Without this, `docker compose config` refuses the
  # whole file the moment `split-workers` is the only profile active — a service cannot depend on
  # one no active profile defines — even though the two are only ever turned on together in
  # practice (the rollback for a box that already sells `finance`). Turning on `split-workers`
  # alone, with no product profile active, now starts `scheduler` too — harmlessly idle, the same
  # trade every other `*-worker` container behind this profile already makes.
  scheduler:
    <<: *background
    profiles: ['finance', 'split-workers']
    image: opsgrids-edge/scheduler
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
    command: ['./bin/worker']
    environment: *service-env

  # ---------------------------------------------------------------- OpsGrids IT (profile `itsm`)
  itsm:
    <<: *service-common
    profiles: ['itsm']
    image: opsgrids-edge/itsm
    build:
      context: ../..
      dockerfile: services/itsm/Dockerfile
    environment: *service-env
    networks:
      - back

networks:
  # Caddy reaches the gateway and storefront. It has no route to Postgres or Redis, and
  # neither does anything else outside `back`.
  front:
  back:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
