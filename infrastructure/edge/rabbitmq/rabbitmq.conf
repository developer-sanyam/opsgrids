# Loaded from /etc/rabbitmq/conf.d/ (the official image sources every *.conf file there,
# alphabetically, after its own generated config — see the image's docker-entrypoint.sh).
# Exists because compose.prod.yml now caps this container at `mem_limit: 256m`
# (ADR-0013's memory-budget erratum, 2026-09-23), and RabbitMQ's own default memory alarm
# — vm_memory_high_watermark.relative = 0.4 of "the memory RabbitMQ believes it has" — must
# fire comfortably *inside* that cgroup limit, not against it.
#
# RabbitMQ (Erlang/OTP 24+, this image) auto-detects a cgroup memory limit and treats it as
# "total available RAM" when one is set — which `mem_limit` is, under the hood, a cgroup limit
# — so the relative watermark below is read against 256 MB, not the box's 3.8 GB. Set higher
# (0.6 instead of the 0.4 default) because the Erlang VM itself and RabbitMQ's own runtime
# already cost real memory before a single message arrives; a 0.4 watermark left too little
# room between "normal idle" and "alarm", and the alarm blocking every publisher (nothing
# errors, the outboxes just fill — the runbook's "the outbox fills" symptom) is worse here than
# a slightly late one.
vm_memory_high_watermark.relative = 0.6

# The default (50 MB, or 1.0x memory limit on newer defaults) is fine for a box with 80 GB of
# disk and one broker; set explicitly so it survives whichever default the image ships next,
# since this alarm has the same "nothing errors, outboxes fill" failure mode as the memory one.
disk_free_limit.absolute = 500MB
