[project]
name = "opsgrids"
version = "0.1.0"
description = "OpsGrids Platform — one ecosystem, many products"
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    # The union of what the *existing* services need. Services are not installed as
    # packages — each exposes a top-level `app`, so only one may live in an environment.
    #
    # A dependency is added here when the service that needs it is built, not before.
    # Carrying an unused SDK costs install time, image size and CVE surface for a service
    # that does not exist yet. The ones waiting their turn:
    #   authlib       → auth-service (OIDC client + provider)
    #   geoalchemy2   → attendance-service (geo-fence)
    #   aiosmtplib    → notification-service
    #   stripe, razorpay → payment-service
    "argon2-cffi>=23.1",       # auth-service password hashing
    # document-service's public asset store (ADR-0009). boto3 was earmarked here and is now
    # installed because the service that needs it exists.
    "boto3>=1.35",             # document-service — the only S3 client in the platform
    # The upload route is the platform's first multipart body. Starlette's form parser is a
    # thin wrapper over this and asserts on its absence rather than importing it lazily.
    "python-multipart>=0.0.20", # document-service — multipart/form-data upload
    # document-service decodes and re-encodes every upload (ADR-0009 §5): the decode is what
    # decides the content type, and the re-encode is what strips EXIF and neutralises polyglots.
    "pillow>=11.0",            # document-service image validation and downscale
    "cryptography>=43.0",      # EdDSA signing keys; PII envelope encryption
    # EmailStr needs this. Note for seeds and fixtures: it rejects .local, .test,
    # .example and .invalid as special-use reserved domains — a .local seed once produced
    # an administrator account that could not log in. Use example.com (RFC 2606).
    "email-validator>=2.2",
    # storefront-service normalises the hostname a buyer's browser arrived on before it becomes
    # a lookup and a cache key (ADR-0012 §2). Already resolved as an httpx transitive; declared
    # here because a direct import of a transitive dependency is a break waiting for whichever
    # release drops it. IDNA2008 with UTS-46, rather than the stdlib's IDNA2003 `encodings.idna`
    # — the two disagree on real names (`ß`, final sigma), and a hostname that encodes
    # differently from the one the browser sent resolves to nothing.
    "idna>=3.10",
    # notification-service verifies a sending domain by asking DNS what it actually publishes
    # (`app/dns_check.py`). The stdlib resolves names to addresses and nothing else — there is no
    # way to read a TXT or CNAME record without a resolver library, and the answer to "has the
    # customer pasted our DKIM record into their registrar yet?" is a TXT lookup or a guess.
    "dnspython>=2.7",
    # account-service refuses a public suffix ("com", "co.uk") as an email-domain claim
    # (`app/domain.py`). Pinned exactly, not `>=`, because this package's version number *is*
    # its Public Suffix List snapshot date (`1.0.2.20260922`) — a floating pin would silently
    # change which domains are refused on every `uv sync`, and that is a decision to make on
    # purpose, in review, not one `uv.lock` should make for us. Zero required dependencies
    # (its own `requests` need is behind an `update` extra this platform never installs), so it
    # never fetches the list over the network — the snapshot ships in the wheel. Bump the pin
    # deliberately, on its own line in a diff, when the list is worth refreshing.
    "publicsuffixlist==1.0.2.20260922",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",       # property tests for money allocation and rounding
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "detect-secrets>=1.5.0",
    "import-linter>=2.13",
    # Validates an event's payload against the JSON Schema its `schema_uri` names
    # (`platform_core.events.validate_event_schema`, `libs/contracts/events/`). Dev/test-time
    # only — no runtime code path seals or opens an event through this, so it costs services
    # nothing in production.
    "jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[tool.uv.workspace]
# Only shared libraries are installable packages. Each service keeps its own
# pyproject.toml for its image, but they all expose a top-level `app` package —
# installing two side by side would make `import app` ambiguous.
members = ["libs/platform-core"]

[tool.uv.sources]
platform-core = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "**/migrations/versions/*.py",
    # The storefront's artwork generator. These are scratch-quality design scripts — they emit
    # the SVGs in `public/img/` and print contact sheets while someone tunes a palette by eye.
    # Nothing imports them, nothing runs them in CI, and they sit outside the Vite build. They
    # are in the repo for one reason: without them, re-tuning a theme's art means redrawing path
    # data by hand. Held to the standard of a sketchbook rather than the platform, deliberately.
    "frontend/product-storefront/tools/art/*.py",
]

[tool.ruff.format]
# The design specs and plans quote partial code (a method without its class, a call without its
# function), and formatting such a fragment rewrites it into something else — a dedented method,
# a tuple where a string was. They are notes about code, not code, so they are not formatted.
exclude = ["docs/superpowers/**/*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # async correctness
    "S",        # bandit
    "T20",      # no print
    "T10",      # no breakpoint() or pdb left behind
    "PGH",      # a bare `# noqa` or `# type: ignore` silences rules nobody chose
    "RUF",
]
ignore = [
    "S101",     # assert is how tests are written
    "B008",     # FastAPI Depends() in defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]   # hardcoded test credentials are fine
"tools/**" = ["T201"]              # a CLI talks to the terminal; that is its job
# preflight.sh's memory budget check shells out to this file's own tiny CLI (see its module
# docstring for why Python and not another awk pass) — printing the total is the whole point.
"infrastructure/edge/lib/memory_budget_totals.py" = ["T201"]
# The demo seeders carry fixture data verbatim from the product SPAs: long single-row records,
# print output, and display glyphs (₹, ⇄, en-dashes, ×) that must render identically to the fixtures.
"tools/demo/seed_*.py" = ["E501", "T201", "RUF001", "RUF002"]
# Event-name constants are not credentials. S105 matches on the variable name containing
# "password", which is exactly what an event about a password change is called.
"services/auth/app/services.py" = ["S105"]
# tests/infra drives the real deploy-tooling scripts (remote.sh, ci-plan.sh) as subprocesses
# against throwaway git repos it builds itself — that is the point, not untrusted input.
"tests/infra/**" = ["S603", "S607"]
# The end-to-end harness starts the real services and drives them over HTTP, so spawning
# subprocesses and printing diagnostics is the job rather than a smell. The password is a
# seeded test credential that never leaves the local database.
"e2e/**" = ["S105", "S603", "S607", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["platform_core", "app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# boto3/botocore ship no type information of their own; the generated stub packages are a
# large install for the three calls `services/document/app/storage.py` makes, and that module
# is the only place in the platform that imports them. jsonschema ships no `py.typed` marker
# either; `platform_core.events.validate_event_schema` is its only caller, and that call is
# dev/test-time only (see its docstring). publicsuffixlist ships no `py.typed` marker either;
# `services/account/app/domain.py` is its only caller.
module = [
    "geoalchemy2.*",
    "razorpay.*",
    "authlib.*",
    "argon2.*",
    "boto3.*",
    "botocore.*",
    "jsonschema.*",
    "publicsuffixlist.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: touches a real database or broker",
    "e2e: drives the running services over HTTP; needs `make infra` and free ports",
]
