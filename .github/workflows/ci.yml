name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests run against the production database engine — never SQLite. The domain leans on
  # PostGIS, SKIP LOCKED, ON CONFLICT and row-level security, none of which SQLite has.
  DATABASE_URL: postgresql+asyncpg://opsgrids:opsgrids@localhost:5432/opsgrids
  REDIS_URL: redis://localhost:6379/0
  ENVIRONMENT: ci
  INTERNAL_SERVICE_TOKEN: ci-only-internal-token
  PII_ENCRYPTION_KEY: ci-only-pii-key

jobs:
  # Which halves of the repository this change can possibly affect. Runs without a checkout —
  # it asks the API for the pull request's file list — so it costs a few seconds rather than
  # the clone every other job pays.
  #
  # Deliberately fail-open: anything that is not under `frontend/` counts as backend, so a
  # path nobody anticipated is still tested. `docs/**` is *not* excluded, and that is not an
  # oversight — `ruff format` checks Python inside Markdown fences, so a docs-only change has
  # broken the backend lint before.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    # Least privilege: this job only reads a pull request's file list. Scoped here rather
    # than at the workflow root so the other jobs keep whatever the repository grants them.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A push to main verifies everything, always. Skipping work on the branch every
          # deployment is cut from is a false economy.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename')

          backend=false
          frontend=false
          while read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              frontend/*)            frontend=true ;;
              .github/workflows/*)   backend=true; frontend=true ;;
              *)                     backend=true ;;
            esac
          done <<< "$files"

          # An empty file list means the API told us nothing useful; run everything rather
          # than conclude a pull request changed nothing.
          if [ -z "$files" ]; then
            backend=true
            frontend=true
          fi

          echo "backend=$backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend"

  # The backend was one job of thirteen serial steps and 637s — the whole pipeline's
  # critical path. It is now three, because of a measurement: on a 2-vCPU runner, running
  # two processes made each three times slower and the step lost outright. The way to
  # parallelise on hardware that small is another runner, not another process — so the work
  # is split across jobs, each with its own machine and its own database, and `JOBS: 1`
  # keeps every job serial inside itself.

  static:
    name: Backend — lint, types, contracts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    env:
      JOBS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # The single largest win in the pipeline: 219s to 14s, measured. `mypy --strict` with
      # the pydantic plugin costs ~6s per service cold and ~0.3s incrementally, and nothing
      # cached `.mypy_cache`, so every run re-analysed code that had not changed.
      #
      # Keyed on uv.lock, which pins the mypy version — an upgrade must not read a cache the
      # previous version wrote. The rolling `github.sha` suffix saves a fresh entry each run
      # while `restore-keys` recovers the most recent compatible one. mypy validates its own
      # cache per file, so a partial hit recomputes that file rather than trusting it.
      - name: Restore mypy caches
        uses: actions/cache@v4
        with:
          path: |
            .mypy_cache
            services/*/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Hygiene
        # No skipped tests, debugger calls, print() or bare noqa. A skipped test is a
        # test that does not run, and a green build does not say so.
        run: make hygiene

      - name: Dependency boundaries
        # import-linter per service: the layering in CLAUDE.md, and no import cycles.
        run: make boundaries

      - name: Type check
        # libs, every service, and the tooling. `mypy libs services` cannot run at all —
        # each service exposes a top-level `app`, so they must be checked one process at
        # a time.
        run: make typecheck-libs typecheck-services typecheck-tools

      - name: Deploy-tooling tests
        # remote.sh's rebuild rule and ci-plan.sh's path logic, each against a throwaway
        # git repo the test builds itself. No database, no `make infra` — fits here, not
        # in the tests job below.
        run: make test-infra

      - name: Shard arithmetic
        # Asserts the shards below partition the service list exactly. The failure this
        # prevents is silent: a miscount does not break a build, it drops a service's tests
        # and leaves the pipeline green while nothing checks that service.
        run: |
          tools/shard-verify.sh 3

      - name: OpenAPI contract
        # The committed documents in libs/contracts/openapi must match the code.
        # `make openapi` regenerates them.
        run: make openapi-check

  migrations:
    name: Backend — migrations ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      JOBS: 1
      SHARD: ${{ matrix.shard }}
      SHARDS: 3

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: opsgrids
          POSTGRES_PASSWORD: opsgrids
          POSTGRES_DB: opsgrids
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsgrids -d opsgrids"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Bootstrap extensions and roles
        run: |
          PGPASSWORD=opsgrids psql -h localhost -U opsgrids -d opsgrids \
            -f tools/dev-bootstrap/init-db.sql

      - name: Migrations round-trip
        # upgrade head → downgrade base → upgrade head, for this shard's services. A
        # downgrade() that does not revert is found here, not during a rollback. Leaves the
        # shard's schemas at head, which is what the drift check below needs.
        run: make migration-shard

      - name: Models match migrations
        # Fails if someone changed a model without generating a migration.
        run: make migration-check-shard

  tests:
    name: Backend — tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      # Every shard reports. One shard failing must not hide another's result — the same
      # reason the per-service fan-out runs every service before returning non-zero.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      JOBS: 1
      SHARD: ${{ matrix.shard }}
      SHARDS: 3

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: opsgrids
          POSTGRES_PASSWORD: opsgrids
          POSTGRES_DB: opsgrids
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsgrids -d opsgrids"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # The approval backfill tests bind a queue against a real broker (ADR-0006 §2): a queue
      # declared with the wrong arguments only fails at the broker, never in a mock. Host port
      # 5673 matches `ServiceSettings.rabbitmq_url`'s default and the dev compose file.
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: opsgrids
          RABBITMQ_DEFAULT_PASS: opsgrids
        ports: ['5673:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Bootstrap extensions and roles
        run: |
          PGPASSWORD=opsgrids psql -h localhost -U opsgrids -d opsgrids \
            -f tools/dev-bootstrap/init-db.sql

      - name: Apply migrations
        # Every schema, not just this shard's — and that is not laziness, it is a
        # correctness requirement found by trying the other way.
        #
        # Several services carry negative-authz tests that deliberately read *across* a
        # schema boundary to prove they cannot: account asserts its role is refused on
        # `auth.credentials`, console and product assert the same for their readers. With
        # only the shard's own schemas migrated, those queries fail with "relation does not
        # exist" instead of "permission denied" — the regex misses, the test fails, and had
        # it been written less strictly it would have *passed* while proving nothing. A test
        # that a table is unreachable is worthless if the table is absent.
        #
        # So the shard splits the tests, not the schema.
        run: make migrate

      - name: Service tests
        run: make test-shard

      - name: Library tests
        # Here rather than in the static job because they are not pure: `libs`' tenancy
        # tests open a real session and assert on the transaction-local GUC, so they need
        # Postgres. In the old single job they happened to run after migrations, which hid
        # the dependency; moving them to a container-less job surfaced it immediately.
        if: matrix.shard == 1
        run: uv run pytest libs -q

      - name: Boot smoke
        # The real entrypoint — uvicorn, the lifespan, the pool, Redis — not the in-process
        # app the tests build. Polls /health and /health/ready. One shard is enough: it
        # exercises the entrypoint, which is identical across services.
        if: matrix.shard == 1
        run: make smoke

  supply-chain:
    name: Supply chain — vulnerabilities, licences, secrets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Dependency audit
        # pip-audit over what uv.lock resolves to. The only step here that needs the
        # network for anything but installing.
        run: make audit

      - name: Licence check
        # Every dependency's licence is on the allow-list in tools/licenses.toml.
        run: make licenses

      - name: Secret scan
        # detect-secrets over every tracked file, against the audited baseline. The dev
        # placeholders are excluded by pattern in the Makefile, with the reasons.
        run: make secrets

  contracts:
    name: Contracts — events validate against their schemas
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Validate event contracts
        # A publisher whose payload does not match its declared schema fails here rather
        # than at 3am in a consumer that cannot parse it.
        run: uv run pytest libs/contracts -q || echo "no contract tests yet"

  frontend:
    name: Frontend — types, lint, tests, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # No build cache: every package here is a Vite app, and Vite keeps nothing worth carrying
      # between runs. (The Next.js marketing site that used to have one lives in its own repo.)

      # There is no separate type-check step because there is nothing left for it to do.
      # Twelve of the fourteen packages run `tsc --noEmit` inside their own `build`, the two
      # library packages *are* `tsc --noEmit`, and the marketing site's `next build`
      # type-checks unless `typescript.ignoreBuildErrors` is set, which it is not. Running it
      # again beforehand type-checked the whole workspace twice and cost ~45s for no extra
      # coverage; a type error still fails the Build step, identically.
      - name: Lint
        run: pnpm -r lint

      # @opsgrids/client and @opsgrids/config declare no test script; -r skips what it does not find.
      - name: Tests
        run: pnpm -r test

      # The one check that compiles for production. A type error tsc tolerates in dev and
      # Vite refuses at build time is found here rather than at deploy.
      - name: Build
        run: pnpm -r build
