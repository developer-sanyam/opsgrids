name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests run against the production database engine — never SQLite. The domain leans on
  # PostGIS, SKIP LOCKED, ON CONFLICT and row-level security, none of which SQLite has.
  DATABASE_URL: postgresql+asyncpg://opsgrids:opsgrids@localhost:5432/opsgrids
  REDIS_URL: redis://localhost:6379/0
  ENVIRONMENT: ci
  INTERNAL_SERVICE_TOKEN: ci-only-internal-token
  PII_ENCRYPTION_KEY: ci-only-pii-key

jobs:
  # Which halves of the repository this change can possibly affect. Runs without a checkout —
  # it asks the API for the pull request's file list — so it costs a few seconds rather than
  # the clone every other job pays.
  #
  # Deliberately fail-open: anything that is not under `frontend/` counts as backend, so a
  # path nobody anticipated is still tested. `docs/**` is *not* excluded, and that is not an
  # oversight — `ruff format` checks Python inside Markdown fences, so a docs-only change has
  # broken the backend lint before.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    # Least privilege: this job only reads a pull request's file list. Scoped here rather
    # than at the workflow root so the other jobs keep whatever the repository grants them.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # Which services the sharded backend jobs (migrations, tests) should actually run,
      # on top of the backend/frontend split above. `services_all=true` means "don't trust
      # the list, run every service in every shard" — exactly today's behaviour — and is
      # the answer whenever anything outside a single services/<name>/ directory changed:
      # libs/platform-core (every service depends on it), libs/contracts, root config,
      # tooling, the workflow itself, or a push that isn't a pull request. `services_list`
      # only matters when services_all is false, and is consumed by
      # tools/filter-affected.sh via the AFFECTED_ALL / AFFECTED_SERVICES env vars — unset
      # (or services_all=true) it is a no-op passthrough, so a target run outside CI, or a
      # CI run this job did not gate, always does the full, safe thing.
      services_all: ${{ steps.filter.outputs.services_all }}
      services_list: ${{ steps.filter.outputs.services_list }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/affected-areas.sh
          sparse-checkout-cone-mode: false
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A push to main verifies everything, always. Skipping work on the branch every
          # deployment is cut from is a false economy. Classification only means anything
          # for a pull request's own diff, so this is the one case tools/affected-areas.sh
          # is not even asked — empty stdin gets the same "run everything" answer from it
          # regardless, but saying so here needs no subprocess.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "backend=true"
              echo "frontend=true"
              echo "services_all=true"
              echo "services_list="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An empty file list means the API told us nothing useful; tools/affected-areas.sh
          # treats no input the same way — run everything rather than conclude a pull
          # request changed nothing.
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename' \
            | tools/affected-areas.sh | tee -a "$GITHUB_OUTPUT"

  # The backend was one job of thirteen serial steps and 637s — the whole pipeline's
  # critical path. It is now three, because of a measurement: on a 2-vCPU runner, running
  # two processes made each three times slower and the step lost outright. The way to
  # parallelise on hardware that small is another runner, not another process — so the work
  # is split across jobs, each with its own machine and its own database, and `JOBS: 1`
  # keeps every job serial inside itself.

  static:
    name: Backend — lint, types, contracts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    env:
      JOBS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # The single largest win in the pipeline: 219s to 14s, measured. `mypy --strict` with
      # the pydantic plugin costs ~6s per service cold and ~0.3s incrementally, and nothing
      # cached `.mypy_cache`, so every run re-analysed code that had not changed.
      #
      # Keyed on uv.lock, which pins the mypy version — an upgrade must not read a cache the
      # previous version wrote. The rolling `github.sha` suffix saves a fresh entry each run
      # while `restore-keys` recovers the most recent compatible one. mypy validates its own
      # cache per file, so a partial hit recomputes that file rather than trusting it.
      - name: Restore mypy caches
        uses: actions/cache@v4
        with:
          path: |
            .mypy_cache
            services/*/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-

      # Every check in this file is one make target, and `make gate` runs the same targets.
      # (Setup — installs, the database bootstrap — is not a check.) That is the whole
      # contract between this file and the Makefile: a check that exists only here is a check
      # nobody can run before pushing, which with Actions unavailable means nobody runs it.
      - name: Lint
        run: make lint

      - name: Hygiene
        # No skipped tests, debugger calls, print() or bare noqa. A skipped test is a
        # test that does not run, and a green build does not say so.
        run: make hygiene

      - name: Dependency boundaries
        # import-linter per service: the layering in CLAUDE.md, and no import cycles.
        run: make boundaries

      - name: Type check
        # libs, every service, and the tooling. `mypy libs services` cannot run at all —
        # each service exposes a top-level `app`, so they must be checked one process at
        # a time.
        run: make typecheck-libs typecheck-services typecheck-tools

      - name: Repository-tooling tests
        # remote.sh's rebuild rule, ci-plan.sh's path logic, and the gate's own checkers
        # (licence expressions, the audit allow-list's expiry, the port check). No database,
        # no `make infra` — fits here, not in the tests job below.
        run: make test-infra

      - name: Shard arithmetic
        # Asserts the shards below partition the service list exactly. The failure this
        # prevents is silent: a miscount does not break a build, it drops a service's tests
        # and leaves the pipeline green while nothing checks that service.
        run: make shard-verify SHARDS=3

      - name: OpenAPI contract
        # The committed documents in libs/contracts/openapi and the permission manifests
        # must match the code. `make openapi` regenerates them.
        run: make openapi-check

      - name: Shell scripts
        # shellcheck at its pinned version — the runner's own is older and disagrees, so the
        # target falls back to the pinned image rather than use it.
        run: make shellcheck

      - name: Dockerfiles
        # hadolint at its pinned version, through its image. Thresholds in .hadolint.yaml.
        run: make hadolint

  migrations:
    name: Backend — migrations ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      JOBS: 1
      SHARD: ${{ matrix.shard }}
      SHARDS: 3
      # Narrows migration-shard / migration-check-shard to what this pull request could
      # affect (tools/filter-affected.sh). services_all=true — any non-pull_request event,
      # or a change outside a single services/<name>/ dir — makes this a no-op: every
      # service in the shard runs, exactly as before the `changes` job computed this.
      AFFECTED_ALL: ${{ needs.changes.outputs.services_all }}
      AFFECTED_SERVICES: ${{ needs.changes.outputs.services_list }}

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: opsgrids
          POSTGRES_PASSWORD: opsgrids
          POSTGRES_DB: opsgrids
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsgrids -d opsgrids"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Bootstrap extensions and roles
        run: |
          PGPASSWORD=opsgrids psql -h localhost -U opsgrids -d opsgrids \
            -f tools/dev-bootstrap/init-db.sql

      - name: Migrations round-trip
        # upgrade head → downgrade base → upgrade head, for this shard's services — or the
        # ones among them AFFECTED_SERVICES names, when the `changes` job set one (see the
        # job-level env comment above and tools/shard-filtered.sh). A downgrade() that does
        # not revert is found here, not during a rollback. Leaves the shard's schemas at
        # head, which is what the drift check below needs — for whichever services this
        # step actually ran; the two steps always agree, since both go through the same
        # filter.
        run: make migration-shard

      - name: Models match migrations
        # Fails if someone changed a model without generating a migration. Same filter as
        # the round-trip above, so it only checks schemas that step actually migrated.
        run: make migration-check-shard

  tests:
    name: Backend — tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      # Every shard reports. One shard failing must not hide another's result — the same
      # reason the per-service fan-out runs every service before returning non-zero.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      JOBS: 1
      SHARD: ${{ matrix.shard }}
      SHARDS: 3
      # Narrows "Service tests" (make test-shard) to what this pull request could affect —
      # see the identical note on the migrations job above. Does not touch "Apply
      # migrations" below, which stays unfiltered on purpose (see that step).
      AFFECTED_ALL: ${{ needs.changes.outputs.services_all }}
      AFFECTED_SERVICES: ${{ needs.changes.outputs.services_list }}

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: opsgrids
          POSTGRES_PASSWORD: opsgrids
          POSTGRES_DB: opsgrids
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsgrids -d opsgrids"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # The approval backfill tests bind a queue against a real broker (ADR-0006 §2): a queue
      # declared with the wrong arguments only fails at the broker, never in a mock. Host port
      # 5673 matches `ServiceSettings.rabbitmq_url`'s default and the dev compose file.
      #
      # The management port (15673 on the host, as in the dev compose file) is there for the
      # ops-monitor integration suite, which creates and deletes a throwaway vhost per test
      # through the management HTTP API.
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: opsgrids
          RABBITMQ_DEFAULT_PASS: opsgrids
        ports: ['5673:5672', '15673:15672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 20
      # Where the ops-monitor integration suite sends real SMTP and reads it back, on the same
      # host ports the dev compose file maps (SMTP 1026, HTTP API 8026). Nothing else uses it.
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports: ['1026:1025', '8026:8025']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Bootstrap extensions and roles
        run: |
          PGPASSWORD=opsgrids psql -h localhost -U opsgrids -d opsgrids \
            -f tools/dev-bootstrap/init-db.sql

      - name: Apply migrations
        # Every schema, not just this shard's — and that is not laziness, it is a
        # correctness requirement found by trying the other way.
        #
        # Several services carry negative-authz tests that deliberately read *across* a
        # schema boundary to prove they cannot: account asserts its role is refused on
        # `auth.credentials`, console and product assert the same for their readers. With
        # only the shard's own schemas migrated, those queries fail with "relation does not
        # exist" instead of "permission denied" — the regex misses, the test fails, and had
        # it been written less strictly it would have *passed* while proving nothing. A test
        # that a table is unreachable is worthless if the table is absent.
        #
        # So the shard splits the tests, not the schema.
        run: make migrate

      - name: Service tests
        # Every service in this shard, unless the `changes` job narrowed AFFECTED_SERVICES
        # — see tools/filter-affected.sh and tools/shard-filtered.sh. Migrations just above
        # are deliberately unfiltered; this step is not, because test-shard's fan-out is
        # service-local by construction (two documented exceptions, folded into
        # AFFECTED_SERVICES by the `changes` job, not into this step).
        run: make test-shard

      - name: Ops-monitor integration database
        # `libs/platform-core/tests/test_ops_monitor_integration.py` targets its own database,
        # `opsgrids_mon`, never the shared one (its module docstring says why), with `account`
        # and `product` migrated into it. Locally `make ops-monitor-db` creates it inside the
        # compose container; this is the same script run from the runner, told where
        # init-db.sql is. The suite needs the broker's management port and MailHog too, which
        # the services above provide.
        if: matrix.shard == 1
        run: |
          PGPASSWORD=opsgrids psql -h localhost -U opsgrids -d opsgrids \
            -v ON_ERROR_STOP=1 -v init_sql=tools/dev-bootstrap/init-db.sql \
            -f tools/dev-bootstrap/ops-monitor-db.sql
          for service in account product; do
            (cd "services/$service" && \
              DATABASE_URL=postgresql+asyncpg://opsgrids:opsgrids@localhost:5432/opsgrids_mon \
              uv run alembic upgrade head)
          done

      - name: Library tests
        # Here rather than in the static job because they are not pure: `libs`' tenancy
        # tests open a real session and assert on the transaction-local GUC, so they need
        # Postgres. In the old single job they happened to run after migrations, which hid
        # the dependency; moving them to a container-less job surfaced it immediately.
        if: matrix.shard == 1
        run: make test-libs

      - name: Boot smoke
        # The real entrypoint — uvicorn, the lifespan, the pool, Redis — not the in-process
        # app the tests build. Polls /health and /health/ready. One shard is enough: it
        # exercises the entrypoint, which is identical across services.
        if: matrix.shard == 1
        run: make smoke

  supply-chain:
    name: Supply chain — vulnerabilities, licences, secrets
    runs-on: ubuntu-latest
    needs: changes
    # Either half: the npm rows audit what the frontend ships, and a frontend-only change is
    # exactly the one that adds an npm dependency.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Dependency audit
        # pip-audit over what uv.lock resolves to. Needs the network for the advisory database.
        run: make audit

      - name: Frontend dependency audit
        # pnpm audit --prod: high and critical fail unless accepted in
        # frontend/audit-allowlist.toml with a reason and an unexpired date.
        run: make frontend-audit

      - name: Licence check
        # Every dependency's licence is on the allow-list in tools/licenses.toml.
        run: make licenses

      - name: Frontend licence check
        # Every production npm package's licence is on the [npm] allow-list, same file.
        run: make frontend-licenses

      - name: Secret scan
        # detect-secrets over every tracked file, against the audited baseline. The dev
        # placeholders are excluded by pattern in the Makefile, with the reasons.
        run: make secrets

  contracts:
    name: Contracts — events validate against their schemas
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Validate event contracts
        # Static: every schema under libs/contracts/events/ is valid JSON Schema, sits where
        # its own event's schema_uri resolves it, and exists for every engage.* event
        # notification declares. No database here — the deeper check, that a real event's
        # payload actually matches its schema, needs a transaction to build one through and
        # runs as part of notification's ordinary test shard instead
        # (services/notification/tests/test_event_contracts.py).
        run: make contracts-check

  frontend:
    name: Frontend — types, lint, boundaries, tests, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # For the port check in frontend-lint only: a stdlib script run with `uv run
      # --no-project`, so there is no Python environment to sync here.
      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: make frontend-install

      # No build cache: every package here is a Vite app, and Vite keeps nothing worth carrying
      # between runs.

      # Type-checked on its own even though every app's `build` runs `tsc --noEmit` again. That
      # costs ~45s, measured, and buys one thing: a type error fails the row named "Type check"
      # before lint and tests run, rather than surfacing minutes later as a build failure. It is
      # also what `make frontend-gate` runs, and this job runs nothing the gate does not.
      - name: Type check
        run: make frontend-typecheck

      # ESLint through the shared preset (jsx-a11y, no focused/skipped/todo tests,
      # --max-warnings=0), then the dev/preview port check.
      - name: Lint
        run: make frontend-lint

      # dependency-cruiser: apps never import each other, shared packages only through their
      # exports, the design system and the SDK never import each other, no cycles.
      - name: Dependency boundaries
        run: make frontend-boundaries

      - name: Tests
        run: make frontend-test

      # The one check that compiles for production — including the storefront's buyer bundle,
      # which is what a merchant's customers actually download.
      - name: Build
        run: make frontend-build
