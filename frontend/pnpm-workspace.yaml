packages:
  # Shared packages every app consumes. Real packages with their own tests, not folders
  # of shared files — an app may not fork a component into itself (ADR-0001).
  - "opsgrids-config"
  - "opsgrids-ui"
  - "opsgrids-client"

  # The visual and accessibility regression harness (frontend/VISUAL-TESTING.md). Tooling, not a
  # surface: nothing ships from it and no app imports it.
  - "opsgrids-visual"

  # One application per surface.
  - "opsgrids-dashboard"
  - "opsgrids-admin"
  - "opsgrids-internal"

  # One application per product. A customer who bought only CRM downloads only CRM.
  - "product-*"

# esbuild ships a platform binary its postinstall fetches; vitest needs it.
allowBuilds:
  esbuild: true

# exceljs (the Excel import/export engine, ADR-0022) pins unzipper ^0.10, whose `binary` chain
# (buffers, chainsaw, traverse) carries no licence metadata and is unmaintained. Only exceljs's
# Node-only streaming reader uses unzipper; the browser build and `workbook.xlsx.load` do not.
overrides:
  "exceljs>unzipper": "0.12.5"
