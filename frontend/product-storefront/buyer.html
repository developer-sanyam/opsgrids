<!doctype html>
<!-- The buyer's document (ADR-0012 §2) — `pnpm build:buyer` → `dist-buyer/index.html`.
     Deliberately lighter than `index.html`: no description meta, no console theme script and no
     web-font link. See `src/main.buyer.tsx` for why each is absent. This comment ships to every
     buyer, so it stays short. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Shop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.buyer.tsx"></script>
  </body>
</html>
