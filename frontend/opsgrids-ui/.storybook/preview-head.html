<!--
  Manrope is loaded exactly as every app's index.html loads it, so the workshop never renders a
  font the apps do not. The visual harness intercepts these two hosts and serves pinned local
  copies (opsgrids-visual/lib/fonts.ts), which is what makes its screenshots deterministic.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
