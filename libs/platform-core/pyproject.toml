[project]
name = "platform-core"
version = "0.1.0"
description = "Shared platform for every OpsGrids service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "redis>=5.2",
    "aio-pika>=9.5",
    # 2.15.1 is the floor because 2.14 changed what `PyJWKClient` does with a `kid` it has not
    # seen: no forced JWKS refresh for `cooldown_duration` (30 s) after a successful fetch, and
    # `PyJWKClientError` instead. `platform_core.auth.decode_token` is written and tested against
    # that behaviour (`tests/test_jwks_key_rotation.py`). An older PyJWT refreshes on every unknown
    # `kid` — the amplification GHSA-2gx3-rcp4-g85q is about — and would fail those tests.
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]
