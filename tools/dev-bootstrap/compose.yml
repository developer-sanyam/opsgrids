name: opsgrids

# Local development infrastructure.
#
# Host ports are deliberately offset from the legacy HRMS stack (5432/6379/5672/9000/1025)
# so both can run on one machine while the rebuild is in progress. Container-internal
# ports are the standard ones.
#
# Dev, staging and production differ only in configuration — same engine versions
# everywhere, because dev/prod parity is not optional when the domain leans on PostGIS,
# SKIP LOCKED and ON CONFLICT.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: opsgrids
      POSTGRES_PASSWORD: opsgrids
      POSTGRES_DB: opsgrids
    ports: ['5434:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The postgis image's own init script is 10_postgis.sh; '-' sorts before '_' in the
      # entrypoint's run order, so mounting this at 10- would run it first and it would fail
      # at the tiger/tiger_data/topology grant before postgis_tiger_geocoder exists. 20- runs
      # after the image's script.
      - ./init-db.sql:/docker-entrypoint-initdb.d/20-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsgrids -d opsgrids']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6380:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: opsgrids
      RABBITMQ_DEFAULT_PASS: opsgrids
    ports: ['5673:5672', '15673:15672']
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # Docker Hub no longer serves MinIO's server image — `minio/minio` 404s there now
    # (verified against the registry, not assumed). quay.io is MinIO's own published mirror
    # for the same tags, and this is the tag `infrastructure/edge/compose.prod.yml` pins for
    # the same reason. Pinned rather than `:latest`: a moved tag on this image now means "the
    # image is gone", not "a new version arrived".
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: opsgrids
      MINIO_ROOT_PASSWORD: opsgrids-secret
    ports: ['9100:9000', '9101:9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: creates the public asset bucket and gives it an anonymous **read-object-only**
  # policy (ADR-0009 §13, "Bootstrap"). Without it `make infra` leaves MinIO running with no
  # bucket at all, and the first upload fails at runtime with an opaque NoSuchBucket.
  #
  # The policy is written out rather than set with `mc anonymous set download`, and that is not
  # a style preference. On the MinIO in this file, `set download` expands to **two** statements:
  # `s3:GetObject` on the objects, and `s3:GetBucketLocation` + **`s3:ListBucket`** on the
  # bucket. The second one is anonymous enumeration — `curl host/opsgrids-public/` returns every
  # key — which destroys the entire isolation argument of ADR-0009 §3: what keeps one tenant out
  # of another's objects is that there is no listing to walk and a v4 UUID is not guessable.
  # Verified against the running container, not assumed. Do not replace this with `set download`,
  # and do not "fix" it to `set public`, which adds write on top.
  #
  # Idempotent on purpose: `mb --ignore-existing` and a policy set are both safe to re-run, so
  # `make infra` on an existing stack is a no-op rather than an error.
  #
  # Runs the same `minio/minio` image rather than `minio/mc`, which is the more obvious choice:
  # `mc` already ships inside the server image — it is what the healthcheck above calls — so
  # reusing it costs `make infra` no second image pull, and keeps the client and the server on
  # one version instead of two that drift independently.
  minio-bootstrap:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: opsgrids
      MINIO_ROOT_PASSWORD: opsgrids-secret
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set og http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing og/opsgrids-public
        cat > /tmp/public-read.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::opsgrids-public/*"]
            }
          ]
        }
        JSON
        mc anonymous set-json /tmp/public-read.json og/opsgrids-public
        echo "opsgrids-public ready: anonymous GetObject only, no ListBucket"
    restart: on-failure

  mailhog:
    image: mailhog/mailhog:latest
    ports: ['1026:1025', '8026:8025']
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
