name: atmora

# Local development infrastructure.
#
# Host ports are deliberately offset from the legacy HRMS stack (5432/6379/5672/9000/1025)
# so both can run on one machine while the rebuild is in progress. Container-internal
# ports are the standard ones.
#
# Dev, staging and production differ only in configuration — same engine versions
# everywhere, because dev/prod parity is not optional when the domain leans on PostGIS,
# SKIP LOCKED and ON CONFLICT.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: atmora
      POSTGRES_PASSWORD: atmora
      POSTGRES_DB: atmora
    ports: ['5434:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atmora -d atmora']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6380:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: atmora
      RABBITMQ_DEFAULT_PASS: atmora
    ports: ['5673:5672', '15673:15672']
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: atmora
      MINIO_ROOT_PASSWORD: atmora-secret
    ports: ['9100:9000', '9101:9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports: ['1026:1025', '8026:8025']
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
